id: secret-safety
title: Prevent and remediate exposed secrets
tiers: [Low, Moderate, High]
guide: controls.html#secret-safety
why: A key in source code or history remains usable even after the file is deleted.
steps:
  - Enable secret scanning and push protection where supported by your plan and organization.
  - Review current files and Git history with an approved secret scanning tool; do not paste discovered values into issues or AI prompts.
  - Revoke and rotate any exposed credential, investigate use, and follow the incident process before history cleanup.
  - Remove committed .env files; retain only placeholder .env.example, .env.sample, or .env.template files.
acceptance:
  - Secret scanning and push protection are enabled or a formal equivalent-control exception is recorded for governance.
  - Exposed credentials have been revoked and rotated; relevant alerts are resolved with evidence.
  - A reviewed history scan and safe local configuration pattern are documented.
prompts:
  - Find places where this app expects credentials and propose environment-based local configuration and managed-identity production configuration. Never print secret values.
