id: secrets-management
title: Use managed identity and a production secret store
tiers: [Low, Moderate, High]
guide: controls.html#secrets-management
why: Production credentials need lifecycle management, auditing, rotation, and least-privilege access.
steps:
  - Prefer identity-based access instead of stored keys; on Azure use Managed Identity for runtime services.
  - Store unavoidable secrets in an approved vault such as Azure Key Vault with narrowly scoped access and audit logging.
  - Separate development and production configuration. Never ship .env files, embed keys in frontend code, or log secrets.
acceptance:
  - Production does not depend on a developer workstation or personal credential.
  - Vault and identity permissions are reviewed, and rotation/recovery procedures exist.
  - Browser bundles, logs, build outputs, and repository history do not expose credentials.
prompts:
  - Propose a migration from local environment secrets to Azure Managed Identity and Key Vault using the SDKs already in this app. Identify permissions I must verify.
