name: Request publication
description: Create a risk-tiered path to production in your solution repository.
title: "[Publication]: "
labels: [publication-request]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste secrets, personal information, customer names, or sensitive architecture here.
        This is a public repository. Use team aliases for owners. For confidential work, deploy this toolkit in a private governance repository.
        A maintainer must allowlist your target repository and authorize processing.
        Describe the intended use even for dev or test: those environments do not reduce the risk tier.
        Read the guide before submitting: https://beardofedu.github.io/publish-solution/
  - type: input
    id: repository
    attributes:
      label: Solution repository
      description: Exact owner/name, not a URL. It must be on the governance allowlist.
      placeholder: contoso/team-helper
    validations:
      required: true
  - type: textarea
    id: solution_description
    attributes:
      label: Solution description
      description: Explain the business purpose, what the app does, and how AI helped build it or is used at runtime. Use non-sensitive examples.
      placeholder: |
        Purpose and intended users:
        Main capabilities and data flows:
        AI-assisted development:
        Runtime AI behavior (or none):
    validations:
      required: true
  - type: input
    id: business
    attributes:
      label: Business owner
      description: Team alias accountable for business use and data decisions.
    validations:
      required: true
  - type: input
    id: technical
    attributes:
      label: Technical owner
      description: Team alias accountable for maintenance and incidents.
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Data classification
      options: [Public, Internal, Confidential, PII, PHI, PCI, Regulated]
    validations:
      required: true
  - type: dropdown
    id: exposure
    attributes:
      label: Exposure
      options: [Internal, External]
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Audience size
      options: [Small team, Organization-wide, Public]
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: AI or LLM usage at runtime
      description: Select Yes if the deployed solution calls a model, not merely because AI helped write code.
      options: [No, Yes]
    validations:
      required: true
  - type: dropdown
    id: integrations
    attributes:
      label: Integrations
      options: [None or read-only, Business-system writes, Privileged]
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: Target hosting
      options: [Azure, Other cloud, Undecided]
    validations:
      required: true
  - type: input
    id: go_live_date
    attributes:
      label: Target go-live date
      description: Requested date in YYYY-MM-DD format. A date is not a guarantee of approval.
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: dropdown
    id: target_environment
    attributes:
      label: Target environment
      description: Planning context only. Dev and test still require truthful production-scope risk answers and governance review.
      options: [dev, test, prod]
    validations:
      required: true
  - type: checkboxes
    id: attestations
    attributes:
      label: Requester attestations
      description: These statements support human review; they do not grant approval or replace evidence.
      options:
        - label: I have not included secrets, personal data, customer names, or sensitive architecture in this issue.
          required: true
        - label: I have read the publication guide linked above and understand that automated readiness is not production approval.
          required: true
        - label: I accept responsibility for completing the generated control issues with evidence and obtaining the required owner and governance reviews.
          required: true
