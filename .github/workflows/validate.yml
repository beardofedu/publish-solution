name: Validate publication readiness
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: publish-solution-mutations
  cancel-in-progress: false
jobs:
  validate:
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'publication-request') &&
      github.event.comment.body == '/validate')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Authorize governance collaborator before minting a target token
        run: node scripts/preflight.mjs
        env:
          HUB_TOKEN: ${{ github.token }}
      - name: Require an explicit App repository list
        run: node scripts/guard-app-scope.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOLUTION_APP_ID: ${{ vars.SOLUTION_APP_ID }}
          SOLUTION_APP_OWNER: ${{ vars.SOLUTION_APP_OWNER }}
          SOLUTION_APP_REPOSITORIES: ${{ vars.SOLUTION_APP_REPOSITORIES }}
          SOLUTION_APP_PRIVATE_KEY: ${{ secrets.SOLUTION_APP_PRIVATE_KEY }}
      - name: Create installation token (recommended)
        if: vars.SOLUTION_APP_ID != ''
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SOLUTION_APP_ID }}
          private-key: ${{ secrets.SOLUTION_APP_PRIVATE_KEY }}
          owner: ${{ vars.SOLUTION_APP_OWNER || github.repository_owner }}
          repositories: ${{ vars.SOLUTION_APP_REPOSITORIES }}
      - name: Validate one request
        if: github.event_name == 'issue_comment'
        run: node scripts/run.mjs validate
        env:
          HUB_TOKEN: ${{ github.token }}
          SOLUTION_TOKEN: ${{ steps.app.outputs.token || secrets.SOLUTION_REPO_TOKEN }}
      - name: Validate all open requests
        if: github.event_name != 'issue_comment'
        run: node scripts/run.mjs sweep
        env:
          HUB_TOKEN: ${{ github.token }}
          SOLUTION_TOKEN: ${{ steps.app.outputs.token || secrets.SOLUTION_REPO_TOKEN }}
