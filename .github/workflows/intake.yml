name: Publication intake
on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: publish-solution-mutations
  cancel-in-progress: false
jobs:
  invalidate-reassessment:
    if: >-
      github.event_name == 'issues' &&
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'reassessment-request') &&
      contains(fromJSON('["opened","edited","reopened"]'), github.event.action)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Authorize governance collaborator
        run: node scripts/preflight.mjs
        env:
          HUB_TOKEN: ${{ github.token }}
      - name: Invalidate original request's advisory decision
        run: node scripts/lifecycle.mjs invalidate
        env:
          HUB_TOKEN: ${{ github.token }}
  intake:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'publication-request') &&
      (github.event_name == 'issues' || github.event.comment.body == '/publish')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Authorize governance collaborator before minting a target token
        run: node scripts/preflight.mjs
        env:
          HUB_TOKEN: ${{ github.token }}
      - name: Require an explicit App repository list
        run: node scripts/guard-app-scope.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOLUTION_APP_ID: ${{ vars.SOLUTION_APP_ID }}
          SOLUTION_APP_OWNER: ${{ vars.SOLUTION_APP_OWNER }}
          SOLUTION_APP_REPOSITORIES: ${{ vars.SOLUTION_APP_REPOSITORIES }}
      - name: Create installation token (recommended)
        if: vars.SOLUTION_APP_ID != ''
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SOLUTION_APP_ID }}
          private-key: ${{ secrets.SOLUTION_APP_PRIVATE_KEY }}
          owner: ${{ vars.SOLUTION_APP_OWNER || github.repository_owner }}
          repositories: ${{ vars.SOLUTION_APP_REPOSITORIES }}
      - name: Generate publication issues
        run: node scripts/run.mjs intake
        env:
          HUB_TOKEN: ${{ github.token }}
          SOLUTION_TOKEN: ${{ steps.app.outputs.token || secrets.SOLUTION_REPO_TOKEN }}
