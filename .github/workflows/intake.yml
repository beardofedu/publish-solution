name: Publication intake
on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: publish-solution-mutations
  cancel-in-progress: false
jobs:
  intake:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'publication-request') &&
      (github.event_name == 'issues' || github.event.comment.body == '/publish')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Authorize governance collaborator before minting a target token
        run: node scripts/preflight.mjs
        env:
          HUB_TOKEN: ${{ github.token }}
      - name: Create installation token (recommended)
        if: vars.SOLUTION_APP_ID != ''
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SOLUTION_APP_ID }}
          private-key: ${{ secrets.SOLUTION_APP_PRIVATE_KEY }}
          owner: ${{ vars.SOLUTION_APP_OWNER || github.repository_owner }}
          repositories: ${{ vars.SOLUTION_APP_REPOSITORIES }}
      - name: Generate publication issues
        run: node scripts/run.mjs intake
        env:
          HUB_TOKEN: ${{ github.token }}
          SOLUTION_TOKEN: ${{ steps.app.outputs.token || secrets.SOLUTION_REPO_TOKEN }}
